<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Ujian SMKN 5 Yogyakarta</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background-color: #f0f4f8;
        }

        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 25px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border-top: 5px solid #0d47a1;
            text-align: center;
        }

        .header h2 {
            color: #0d47a1;
            font-size: 18px;
            margin-bottom: 4px;
        }

        .header p {
            color: #64748b;
            font-size: 12px;
            margin-bottom: 18px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #0d47a1;
        }

        .btn-submit {
            width: 100%;
            padding: 11px;
            background: #0d47a1;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: #1565c0;
        }

        .error-msg {
            color: #dc2626;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }

        .pengawas-area {
            margin-top: 15px;
            border-top: 1px solid #e2e8f0;
            padding-top: 12px;
        }

        .pengawas-link {
            font-size: 11px;
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
        }

        .pengawas-link:hover {
            color: #0d47a1;
        }

        /* TAMPILAN MENU SOAL */
        #menuSection {
            display: none;
        }

        .menu-header {
            background: #0d47a1;
            color: #ffffff;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
        }

        .menu-header h1 {
            font-size: 14px;
        }

        .btn-logout {
            background: #ef4444;
            color: #ffffff;
            padding: 5px 10px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
        }

        .menu-list {
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        .item-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            text-align: left;
        }

        .item-title {
            font-size: 14px;
            font-weight: 700;
            color: #0d47a1;
            margin-bottom: 4px;
        }

        .item-info {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 10px;
        }

        .btn-gform {
            display: block;
            text-align: center;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="container">

        <!-- HALAMAN 1: FORM LOGIN TOKEN -->
        <div id="loginSection" class="card">
            <div class="header">
                <h2>ASTS SMKN 5 Yogyakarta</h2>
                <p>Masukkan Token Ujian Sesi Berjalan</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="tokenInput">TOKEN UJIAN</label>
                    <input type="text" id="tokenInput" placeholder="Contoh: K5-8392" maxlength="10" required autocomplete="off">
                </div>
                <button type="submit" class="btn-submit">Masuk Ujian</button>
                <div id="errorMsg" class="error-msg">Token salah atau sudah kadaluwarsa!</div>
            </form>

            <!-- TOMBOL PENGAWAS -->
            <div class="pengawas-area">
                <a href="pengawas.html" class="pengawas-link">🔒 Akses Pengawas Ujian &rarr;</a>
            </div>
        </div>

        <!-- HALAMAN 2: DAFTAR MENU SOAL UJIAN -->
        <div id="menuSection" class="card">
            <div class="menu-header">
                <div>
                    <h1>Menu Ujian Hari Ini</h1>
                    <p style="font-size: 10px; color: #93c5fd;">SMKN 5 Yogyakarta</p>
                </div>
                <button onclick="logout()" class="btn-logout">Keluar</button>
            </div>

            <div class="menu-list">
                <div class="item-card">
                    <div class="item-title">Matematika</div>
                    <div class="item-info">Durasi: 90 Menit | 30 PG</div>
                    <a href="https://docs.google.com/forms/d/e/PASTE_LINK_GFORM_1/viewform" target="_top" class="btn-gform">Kerjakan Soal</a>
                </div>

                <div class="item-card">
                    <div class="item-title">Bahasa Indonesia</div>
                    <div class="item-info">Durasi: 90 Menit | 40 PG</div>
                    <a href="https://docs.google.com/forms/d/e/PASTE_LINK_GFORM_2/viewform" target="_top" class="btn-gform">Kerjakan Soal</a>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    function generateComplexToken() {
        const SECRET_KEY = 5791;
        const now = new Date();
        const tanggal = now.getDate();
        const bulan = now.getMonth() + 1;
        const jam = now.getHours();
        
        const seed = (tanggal * 10000) + (bulan * 100) + jam + SECRET_KEY;
        const hashCode = Math.floor(Math.abs(Math.sin(seed) * 10000));
        return "K5-" + String(hashCode).padStart(4, '0');
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const inputVal = document.getElementById('tokenInput').value.trim().toUpperCase();
        const validToken = generateComplexToken();

        if (inputVal === validToken) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('menuSection').style.display = 'block';
        } else {
            document.getElementById('errorMsg').style.display = 'block';
        }
    });

    function logout() {
        document.getElementById('tokenInput').value = '';
        document.getElementById('errorMsg').style.display = 'none';
        document.getElementById('menuSection').style.display = 'none';
        document.getElementById('loginSection').style.display = 'block';
    }
</script>

</body>
</html>
